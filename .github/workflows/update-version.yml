name: Update site build version

on:
  push:
    branches:
      - spotify-preview-prototype
    paths-ignore:
      - version.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          ref: spotify-preview-prototype

      - name: Generate build timestamp
        run: |
          VERSION="$(date -u +'%Y.%m.%d-%H%M%S')"
          BUILT_AT="$(date -u +'%Y-%m-%d %H:%M:%S')"
          printf '{\n  "version": "%s",\n  "builtAt": "%s"\n}\n' "$VERSION" "$BUILT_AT" > version.json

      - name: Commit version file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          if ! git diff --cached --quiet; then
            git commit -m "Update site build version"
            git push
          fi
